name: Compress Images
run-name: Compress images by @${{ github.actor }}
on:
  workflow_dispatch:
jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@1.5.0
        with:
          compressOnly: true
          jpegQuality: "100"
          jpegProgressive: true
          pngQuality: "100"
          webpQuality: "100"
      - name: debug
        run: git status && git diff && git branch
      - name: Open a PR with the compressed images
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          REPORT: ${{ steps.calibre.outputs.markdown }}
        run: |
          if git diff --quiet; then
            echo "compression good already - no changes."
            exit 0
          fi
          branch="compress-images-${BASE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "Compress images" -m "$REPORT"
          git push -f origin "$branch"
          pr=$(gh pr list --head "$branch" --base "$BASE" --state open --json url -q '.[0].url')
          if [ -n "$pr" ]; then
            echo "PR already exists: $pr"
          else
            gh pr create --head "$branch" --base "$BASE" --title "Compress images" --body "${REPORT:-Compressed images.}"
          fi
