name: Host user guide
run-name: Host user guide on geigl.online by @${{ github.actor }}
on:
  push:
    branches:
      - "main"
    paths:
      - "**.md"
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - ".github/workflows/host-user-guide.yml"
  workflow_dispatch:
jobs:
  build:
    name: Host user guide
    runs-on: ubuntu-latest
    env:
      GUIDE: ./geigl.online/meditate_app/user_guide
      AD: ./geigl.online/meditate_app/advertisement
      PRIVACY: ./geigl.online/meditate_app/data_privacy
      IMAGES: ./geigl.online/meditate_app/images
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: "floriangeigl/floriangeigl.github.io"
          path: ./geigl.online/
          ref: master
          token: ${{ secrets.FLORIANGEIGL_GITHUB_IO_TOKEN }}
      - name: prepare meditate_app folders
        run: |
          # pages lived flat in the site root before 2026-10
          rm -f ./geigl.online/meditate_app*.md
          rm -rf ./geigl.online/meditate_app_user_guide
          mkdir -p "$GUIDE" "$AD" "$PRIVACY" "$IMAGES"
      - name: create user guide pages
        run: |
          cat UserGuide.md > $GUIDE/meditate_app_user_guide.md
          for f in generated/UserGuides/UserGuide-*.md; do
            [ -f "$f" ] || continue
            lang="$(basename "$f")"
            lang="${lang#UserGuide-}"
            lang="${lang%.md}"
            cat "$f" > "$GUIDE/meditate_app_user_guide-${lang}.md"
          done
          cp -r ./userGuideScreenshots/. "$IMAGES/"
          # Copy translated hero images
          for f in generated/HeroImages/hero_meditate-*.png; do
            [ -f "$f" ] || continue
            cp "$f" "$IMAGES/"
          done
          # Fix image paths in user guide files only
          for f in $GUIDE/meditate_app_user_guide.md $GUIDE/meditate_app_user_guide-*.md; do
            [ -f "$f" ] || continue
            sed -i 's|/\?meditate_app_user_guide/userGuideScreenshots/|__IMG__|g; s|/meditate_app/images/|__IMG__|g; s|userGuideScreenshots/|__IMG__|g; s|__IMG__|/meditate_app/images/|g' "$f"
          done
          # Update hero image references in translated user guide pages
          for f in generated/HeroImages/hero_meditate-*.png; do
            [ -f "$f" ] || continue
            lang="$(basename "$f")"
            lang="${lang#hero_meditate-}"
            lang="${lang%.png}"
            md="$GUIDE/meditate_app_user_guide-${lang}.md"
            [ -f "$md" ] && sed -i "s|hero_meditate\.png|hero_meditate-${lang}.png|g" "$md"
          done

      - name: add language navigation to user guides
        shell: bash
        run: |
          declare -A LANG_NAMES=([en]="English" [de]="Deutsch" [es]="Español" [ko]="한국어" [pt]="Português" [fr]="Français" [it]="Italiano" [ja]="日本語" [zh]="中文" [nl]="Nederlands" [ru]="Русский" [uk]="Українська")

          LANGS=("en")
          for f in generated/UserGuides/UserGuide-*.md; do
            [ -f "$f" ] || continue
            lang="$(basename "$f")"
            lang="${lang#UserGuide-}"
            lang="${lang%.md}"
            LANGS+=("$lang")
          done

          # Fix permalinks for translated guides
          for lang in "${LANGS[@]}"; do
            [ "$lang" = "en" ] && continue
            target="$GUIDE/meditate_app_user_guide-${lang}.md"
            sed -i "s|permalink: /meditate_app_user_guide/|permalink: /meditate_app_user_guide-${lang}/|" "$target"
          done

          # Insert language nav into each guide
          for current in "${LANGS[@]}"; do
            if [ "$current" = "en" ]; then
              target="$GUIDE/meditate_app_user_guide.md"
            else
              target="$GUIDE/meditate_app_user_guide-${current}.md"
            fi

            nav="<div><small>🌐"
            first=true
            for other in "${LANGS[@]}"; do
              name="${LANG_NAMES[$other]:-$other}"
              $first || nav+=" |"
              first=false
              if [ "$other" = "$current" ]; then
                nav+=" <b>${name}</b>"
              elif [ "$other" = "en" ]; then
                nav+=" <a href=\"/meditate_app_user_guide/\">${name}</a>"
              else
                nav+=" <a href=\"/meditate_app_user_guide-${other}/\">${name}</a>"
              fi
            done
            nav+="</small></div>"

            sed -i 's/\r$//' "$target"
            awk -v nav="$nav" 'BEGIN{c=0} /^---$/{c++; print; if(c==2){print ""; print nav; print ""} next} {print}' "$target" > "${target}.tmp" && mv "${target}.tmp" "$target"
          done

      - name: create advertisement pages
        run: |
          cat Advertisement.md > $AD/meditate_app.md
          for f in generated/Advertisements/Advertisement-*.md; do
            [ -f "$f" ] || continue
            lang="$(basename "$f")"
            lang="${lang#Advertisement-}"
            lang="${lang%.md}"
            cat "$f" > "$AD/meditate_app-${lang}.md"
          done
          # Fix image paths in advertisement files only
          for f in $AD/meditate_app.md $AD/meditate_app-*.md; do
            [ -f "$f" ] || continue
            sed -i 's|/\?meditate_app_user_guide/userGuideScreenshots/|__IMG__|g; s|/meditate_app/images/|__IMG__|g; s|userGuideScreenshots/|__IMG__|g; s|__IMG__|/meditate_app/images/|g' "$f"
          done
          # Update hero image references in translated advertisement pages
          for f in generated/HeroImages/hero_meditate-*.png; do
            [ -f "$f" ] || continue
            lang="$(basename "$f")"
            lang="${lang#hero_meditate-}"
            lang="${lang%.png}"
            md="$AD/meditate_app-${lang}.md"
            [ -f "$md" ] && sed -i "s|hero_meditate\.png|hero_meditate-${lang}.png|g" "$md"
          done

      - name: add language navigation to advertisements
        shell: bash
        run: |
          declare -A LANG_NAMES=([en]="English" [de]="Deutsch" [es]="Español" [ko]="한국어" [pt]="Português" [fr]="Français" [it]="Italiano" [ja]="日本語" [zh]="中文" [nl]="Nederlands" [ru]="Русский" [uk]="Українська")

          LANGS=("en")
          for f in generated/Advertisements/Advertisement-*.md; do
            [ -f "$f" ] || continue
            lang="$(basename "$f")"
            lang="${lang#Advertisement-}"
            lang="${lang%.md}"
            LANGS+=("$lang")
          done

          # Fix permalinks for translated advertisements
          for lang in "${LANGS[@]}"; do
            [ "$lang" = "en" ] && continue
            target="$AD/meditate_app-${lang}.md"
            sed -i "s|permalink: /meditate_app/|permalink: /meditate_app-${lang}/|" "$target"
          done

          # Insert language nav into each advertisement
          for current in "${LANGS[@]}"; do
            if [ "$current" = "en" ]; then
              target="$AD/meditate_app.md"
            else
              target="$AD/meditate_app-${current}.md"
            fi

            nav="<div><small>🌐"
            first=true
            for other in "${LANGS[@]}"; do
              name="${LANG_NAMES[$other]:-$other}"
              $first || nav+=" |"
              first=false
              if [ "$other" = "$current" ]; then
                nav+=" <b>${name}</b>"
              elif [ "$other" = "en" ]; then
                nav+=" <a href=\"/meditate_app/\">${name}</a>"
              else
                nav+=" <a href=\"/meditate_app-${other}/\">${name}</a>"
              fi
            done
            nav+="</small></div>"

            sed -i 's/\r$//' "$target"
            awk -v nav="$nav" 'BEGIN{c=0} /^---$/{c++; print; if(c==2){print ""; print nav; print ""} next} {print}' "$target" > "${target}.tmp" && mv "${target}.tmp" "$target"
          done

      - name: create privacy policy pages
        shell: bash
        run: |
          declare -A LANG_NAMES=([en]="English" [de]="Deutsch" [es]="Español" [ko]="한국어" [pt]="Português" [fr]="Français" [it]="Italiano" [ja]="日本語" [zh]="中文" [nl]="Nederlands" [ru]="Русский" [uk]="Українська")

          cat DataPrivacy.md > $PRIVACY/meditate_app_data_privacy.md
          LANGS=("en")
          for f in generated/DataPrivacy/DataPrivacy-*.md; do
            [ -f "$f" ] || continue
            lang="$(basename "$f")"
            lang="${lang#DataPrivacy-}"
            lang="${lang%.md}"
            LANGS+=("$lang")
            target="$PRIVACY/meditate_app_data_privacy-${lang}.md"
            cat "$f" > "$target"
            sed -i "s|permalink: /meditate_app_data_privacy/|permalink: /meditate_app_data_privacy-${lang}/|" "$target"
            # point the guide and ad page of this language to their privacy policy
            for page in "$GUIDE/meditate_app_user_guide-${lang}.md" "$AD/meditate_app-${lang}.md"; do
              [ -f "$page" ] && sed -i "s|(/meditate_app_data_privacy/)|(/meditate_app_data_privacy-${lang}/)|g" "$page"
            done
          done

          # Insert language nav into each privacy policy, once there is more than English
          [ "${#LANGS[@]}" -gt 1 ] || exit 0
          for current in "${LANGS[@]}"; do
            if [ "$current" = "en" ]; then
              target="$PRIVACY/meditate_app_data_privacy.md"
            else
              target="$PRIVACY/meditate_app_data_privacy-${current}.md"
            fi

            nav="<div><small>🌐"
            first=true
            for other in "${LANGS[@]}"; do
              name="${LANG_NAMES[$other]:-$other}"
              $first || nav+=" |"
              first=false
              if [ "$current" = "$other" ]; then
                nav+=" <b>${name}</b>"
              elif [ "$other" = "en" ]; then
                nav+=" <a href=\"/meditate_app_data_privacy/\">${name}</a>"
              else
                nav+=" <a href=\"/meditate_app_data_privacy-${other}/\">${name}</a>"
              fi
            done
            nav+="</small></div>"

            sed -i 's/\r$//' "$target"
            awk -v nav="$nav" 'BEGIN{c=0} /^---$/{c++; print; if(c==2){print ""; print nav; print ""} next} {print}' "$target" > "${target}.tmp" && mv "${target}.tmp" "$target"
          done
      - name: git add
        run: ls -lah && cd ./geigl.online/ && git add .
      - name: debug
        run: cd ./geigl.online/ && git status && git diff && ls -lah
      - name: Commit & Push changes
        uses: actions-js/push@v1.5
        with:
          directory: ./geigl.online/
          github_token: ${{ secrets.FLORIANGEIGL_GITHUB_IO_TOKEN }}
          repository: floriangeigl/floriangeigl.github.io
          message: auto-update user guide of meditation & breathwork garmin app
          branch: master
