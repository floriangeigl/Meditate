name: Translate texts, guides, etc
run-name: Translate texts, guides, etc by @${{ github.actor }}
concurrency:
  group: translate-content
  cancel-in-progress: true
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scope:
        description: "What to translate (changed only = what changed since the last translation, like a release)"
        type: choice
        options:
          - changed only
          - everything
          - text only
          - hero images only
        default: changed only
env:
  SCOPE: ${{ inputs.scope || 'changed only' }}
jobs:
  plan:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      text: ${{ steps.plan.outputs.text }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Find outdated translations
        id: plan
        run: python3 .github/scripts/translate.py plan --scope "$SCOPE" >> "$GITHUB_OUTPUT"

  prepare-branch:
    name: Prepare translation branch
    needs: plan
    if: needs.plan.outputs.text == 'true' || needs.plan.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: cleanup and create release-translation branch
        run: |
          git push -d origin release-translation || echo "no remote branch to cleanup"
          git checkout -B release-translation
          git push -f origin release-translation

  translate-text:
    name: Translate text
    needs: [plan, prepare-branch]
    if: needs.plan.outputs.text == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-translation
      - name: Install OpenAI SDK
        run: pip install --quiet -r .github/scripts/requirements.txt
      - name: Translate text files
        env:
          OPENAI_API_KEY: ${{ secrets.CHATGPT_TOKEN }}
        run: python3 .github/scripts/translate.py text --scope "$SCOPE"
      - name: Commit text translations
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./generated/
          git commit -m "Update text translations" || echo "No text translation changes to commit"
          git pull --rebase origin release-translation || true
          git push origin release-translation

  translate-images:
    name: Translate hero image
    needs: [plan, prepare-branch]
    if: needs.plan.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-translation
      - name: Install OpenAI SDK
        run: pip install --quiet -r .github/scripts/requirements.txt
      - name: Translate hero image for each language
        env:
          OPENAI_API_KEY: ${{ secrets.CHATGPT_TOKEN }}
        run: python3 .github/scripts/translate.py images --scope "$SCOPE"
      - name: Commit image translations
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./generated/
          git commit -m "Update hero image translations" || echo "No image translation changes to commit"
          git pull --rebase origin release-translation || true
          git push origin release-translation

  create-pr:
    name: Create or update PR
    needs: [plan, translate-text, translate-images]
    if: always() && (needs.translate-text.result == 'success' || needs.translate-images.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or update PR to main
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:release-translation`;
            const base = 'main';

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              head,
              base,
              state: 'open',
              per_page: 10,
            });

            if (pulls.length > 0) {
              core.info(`PR already exists: #${pulls[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head: 'release-translation',
              base,
              title: 'Update translations',
              body: 'Automated translation updates generated by the translation workflow.',
              maintainer_can_modify: true,
            });

            core.info(`Created PR: #${pr.number}`);
